<body>

    <!-- App Header -->
    <div class="app-header">
        <button id="mobile-menu-btn">☰</button>
        <h2>Expense Manager</h2>
    </div>

    <div class="page-wrapper main-content">
        
        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="summary-card total">
                <h4>Total Spent</h4>
                <h2 id="total-spent">₹0</h2>
            </div>
            <div class="summary-card fuel">
                <h4>Fuel</h4>
                <h2 id="fuel-spent">₹0</h2>
            </div>
            <div class="summary-card service">
                <h4>Service</h4>
                <h2 id="service-spent">₹0</h2>
            </div>
        </div>

        <h3 style="color: #cba6f7; margin-bottom: 15px;">Recent Transactions</h3>
        
        <!-- List Container -->
        <div class="expense-list" id="expense-list-container">
            <!-- Expenses will be injected here by JavaScript -->
            <p style="color: #a6adc8; text-align: center; padding: 20px 0;">No expenses logged yet.</p>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-button" id="open-modal-btn">➕</button>

    <!-- Add Expense Modal -->
    <div class="modal" id="expense-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #cdd6f4;">Log New Expense</h3>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="exp-date" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="exp-category">
                    <option value="Fuel">Fuel</option>
                    <option value="Service">Maintenance / Service</option>
                    <option value="Insurance">Insurance / RC / Tolls</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="exp-title" placeholder="e.g. Shell Petrol, Brake Pads" required>
            </div>
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="exp-amount" placeholder="0" required>
            </div>
            <button class="btn-save" id="save-exp-btn">Save Expense</button>
            <button class="btn-cancel" id="close-modal-btn">Cancel</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderExpensePage();

            // Mobile menu toggle
            const menuBtn = document.getElementById('mobile-menu-btn');
            if(menuBtn) {
                menuBtn.addEventListener('click', () => {
                    document.querySelector('.sidebar')?.classList.toggle('active');
                });
            }

            // Modal Controls
            const modal = document.getElementById('expense-modal');
            document.getElementById('open-modal-btn').addEventListener('click', () => {
                // Pre-fill date to today
                document.getElementById('exp-date').value = new Date().toISOString().split('T')[0];
                modal.style.display = 'flex';
            });
            document.getElementById('close-modal-btn').addEventListener('click', () => {
                modal.style.display = 'none';
            });

            // Save new expense
            document.getElementById('save-exp-btn').addEventListener('click', () => {
                const date = document.getElementById('exp-date').value;
                const category = document.getElementById('exp-category').value;
                const title = document.getElementById('exp-title').value;
                const amount = parseFloat(document.getElementById('exp-amount').value);

                if(!date || !title || isNaN(amount)) {
                    alert("Please fill in all details!");
                    return;
                }

                // Save to core state
                addExpense({
                    vehicleId: getSelectedVehicleId(),
                    category: category,
                    amount: amount,
                    date: date,
                    title: title
                });

                // Reset form and close modal
                document.getElementById('exp-title').value = '';
                document.getElementById('exp-amount').value = '';
                modal.style.display = 'none';

                // Refresh the page data immediately
                renderExpensePage();
            });
        });

        // Function to update cards and list
        function renderExpensePage() {
            const expenses = getExpenses(getSelectedVehicleId());
            
            let totalSpent = 0;
            let fuelSpent = 0;
            let serviceSpent = 0;

            const container = document.getElementById('expense-list-container');
            container.innerHTML = '';

            if (expenses.length === 0) {
                container.innerHTML = '<p style="color: #a6adc8; text-align: center; padding: 20px 0;">No expenses logged yet.</p>';
                return;
            }

            const sortedExpenses = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedExpenses.forEach(exp => {
                const amount = Number(exp.amount) || 0;
                totalSpent += amount;
                if(exp.category === 'Fuel') fuelSpent += amount;
                if(exp.category === 'Service') serviceSpent += amount;

                // Create list item
                const item = document.createElement('div');
                item.classList.add('expense-item');
                
                const catClass = exp.category.toLowerCase(); // 'fuel', 'service', or 'insurance'
                
                item.innerHTML = `
                    <div class="exp-details">
                        <h4>${exp.title}</h4>
                        <p>${exp.date} • ${exp.category}</p>
                    </div>
                    <div class="exp-amount ${catClass}">₹${amount.toFixed(2)}</div>
                `;
                container.appendChild(item);
            });

            // Update DOM with calculated totals
            document.getElementById('total-spent').innerText = `₹${totalSpent.toLocaleString()}`;
            document.getElementById('fuel-spent').innerText = `₹${fuelSpent.toLocaleString()}`;
            document.getElementById('service-spent').innerText = `₹${serviceSpent.toLocaleString()}`;
        }
    </script>
</body>
