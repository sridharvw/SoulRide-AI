<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details | SoulRide AI</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="vehicle-details.css">
    <script src="theme.js"></script>
    <script src="soulride-core.js"></script>
</head>
<body>
    <main class="vehicle-details-page">
        <header class="details-header">
            <a class="back-link" href="garage.html"><i class="bx bx-arrow-back"></i> My Garage</a>
            <a class="settings-link" href="setting.html"><i class="bx bx-cog"></i></a>
        </header>

        <section class="vehicle-hero" id="vehicleHero">
            <div class="vehicle-hero-copy">
                <p class="eyebrow">Equipped Vehicle</p>
                <h1 id="vehicleTitle">Loading vehicle...</h1>
                <p id="vehicleMeta"></p>
                <label class="vehicle-switcher-label" for="vehicleSwitcher">Switch equipped vehicle</label>
                <select id="vehicleSwitcher" aria-label="Switch equipped vehicle"></select>
            </div>
            <div class="vehicle-hero-image" id="vehicleImage"><i class="bx bx-car"></i></div>
        </section>

        <section class="details-stats" aria-label="Vehicle summary">
            <div class="details-stat"><span>Latest odometer</span><strong id="odometerValue">0 km</strong></div>
            <div class="details-stat"><span>Total spent</span><strong id="totalSpentValue">₹0</strong></div>
            <div class="details-stat"><span>Services</span><strong id="serviceCountValue">0</strong></div>
            <div class="details-stat"><span>Fuel logs</span><strong id="fuelCountValue">0</strong></div>
        </section>

        <section class="details-grid">
            <article class="details-panel">
                <div class="panel-heading"><h2>Recent activity</h2><a href="reports.html">View reports</a></div>
                <div id="recentActivity"><p class="empty-state">No records for this vehicle yet.</p></div>
            </article>
            <article class="details-panel">
                <div class="panel-heading"><h2>Vehicle information</h2><a href="add-vehicle.html">Edit vehicle</a></div>
                <dl class="vehicle-information" id="vehicleInformation"></dl>
            </article>
        </section>

        <nav class="vehicle-actions" aria-label="Vehicle actions">
            <a href="maintenance.html"><i class="bx bx-wrench"></i> Maintenance</a>
            <a href="fueltracker.html"><i class="bx bx-gas-pump"></i> Fuel tracker</a>
            <a href="expense.html"><i class="bx bx-wallet"></i> Expenses</a>
            <a href="analytics.html"><i class="bx bx-line-chart"></i> Analytics</a>
        </nav>
    </main>
    <script src="vehicle-details.js"></script>
</body>
</html>
